name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Launcher Icon and Native Widget Files
        run: |
          # Copy App Logo
          if [ -f "www/assets/images/logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              mkdir -p "$dir"
              cp www/assets/images/logo.png "$dir/ic_launcher.png" || true
              cp www/assets/images/logo.png "$dir/ic_launcher_round.png" || true
              cp www/assets/images/logo.png "$dir/ic_launcher_foreground.png" || true
            done
          fi

          # Register Widget in AndroidManifest.xml if not already present
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "StreakWidgetProvider" "$MANIFEST"; then
            python3 -c '
            with open("android/app/src/main/AndroidManifest.xml", "r") as f:
                content = f.read()

            receiver = """
            <receiver android:name=\".StreakWidgetProvider\" android:exported=\"false\">
                <intent-filter>
                    <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />
                </intent-filter>
                <meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/streak_widget_info\" />
            </receiver>
            </application>
            """
            content = content.replace("</application>", receiver)
            with open("android/app/src/main/AndroidManifest.xml", "w") as f:
                f.write(content)
            '
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Chemistry-Explorer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
