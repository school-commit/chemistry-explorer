name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Pillow
        run: |
          npm install
          python3 -m pip install --quiet pillow

      - name: Auto-Link Flashcards, Vault, Fonts & QR into www/
        run: |
          mkdir -p www/assets/images www/assets/fonts

          for f in fc-ch*.js fc_ch*.js vault-part*.js vault_part*.js; do
            if [ -f "$f" ]; then
              cp "$f" "www/$f"
            fi
          done

          if [ -f "qr.jpg" ]; then
            cp "qr.jpg" "www/assets/images/qr.jpg"
          fi

          for font in *.ttf fonts/*.ttf; do
            if [ -f "$font" ]; then
              cp "$font" "www/assets/fonts/"
            fi
          done

          python3 - <<'PY'
          import os
          path = "www/index.html"
          if not os.path.exists(path):
              exit(0)

          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          scripts = []
          for i in range(1, 10):
              for fname in [f"fc-ch{i}.js", f"fc_ch{i}.js"]:
                  if os.path.exists(f"www/{fname}") and fname not in html:
                      scripts.append(f'<script src="{fname}"></script>')
                      break

          for i in range(1, 4):
              for fname in [f"vault-part{i}.js", f"vault_part{i}.js"]:
                  if os.path.exists(f"www/{fname}") and fname not in html:
                      scripts.append(f'<script src="{fname}"></script>')
                      break

          if scripts:
              inject = "\n  ".join(scripts) + '\n  <script src="games-engine.js"></script>'
              html = html.replace('<script src="games-engine.js"></script>', inject, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
          PY

      - name: Clean and Fresh Android Add & Sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Native Widget with Custom Background Sync & Assets
        run: |
          MAIN="android/app/src/main"
          RES="$MAIN/res"
          PKG_DIR="$MAIN/java/com/adityamaurya/chemexplorer"

          mkdir -p "$PKG_DIR" "$RES/layout" "$RES/xml" "$RES/drawable" "$RES/drawable-nodpi"

          # 1) Logo conversion to genuine PNG
          python3 - <<'PY'
          import os
          from PIL import Image
          for p in ["www/assets/images/logo.png", "assets/images/logo.png"]:
              if os.path.exists(p):
                  try:
                      im = Image.open(p)
                      im.convert("RGBA").save("clean_logo.png", format="PNG")
                      break
                  except Exception:
                      pass
          PY

          if [ -f "clean_logo.png" ]; then
            rm -rf "$RES"/mipmap-anydpi-v26
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$RES/mipmap-$d"
              cp clean_logo.png "$RES/mipmap-$d/ic_launcher.png"
              cp clean_logo.png "$RES/mipmap-$d/ic_launcher_round.png"
              cp clean_logo.png "$RES/mipmap-$d/ic_launcher_foreground.png"
            done
          fi

          # 2) Copy all 6 widget backgrounds into drawable-nodpi
          for n in 1 2 3 4 5 6; do
            SRC=""
            for p in "www/assets/images/widget$n.jpg" "assets/images/widget$n.jpg"; do
              if [ -f "$p" ]; then
                SRC="$p"
                break
              fi
            done
            DST="$RES/drawable-nodpi/widget_bg_$n.jpg"
            if [ -n "$SRC" ]; then
              cp "$SRC" "$DST"
              echo "Installed widget background $n"
            fi
          done

          # 3) Widget Drawables (Default Frame, Photo Overlay, XP Pill, Progress)
          cat > "$RES/drawable/widget_card_frame.xml" <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFF1A8" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="#FF1E1E1E" />
          </shape>
          XML

          cat > "$RES/drawable/widget_photo_overlay.xml" <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#59000000" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="#FF1E1E1E" />
          </shape>
          XML

          cat > "$RES/drawable/widget_xp_pill.xml" <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFCDEBCB" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#FF1E1E1E" />
          </shape>
          XML

          cat > "$RES/drawable/widget_progress_draw.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape android:shape="rectangle">
                      <solid android:color="#FFFFFFFF" />
                      <corners android:radius="10dp" />
                      <stroke android:width="1dp" android:color="#FF1E1E1E" />
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape android:shape="rectangle">
                          <solid android:color="#FF8EE08A" />
                          <corners android:radius="10dp" />
                      </shape>
                  </clip>
              </item>
          </layer-list>
          XML

          # 4) Layered RemoteViews Layout supporting Custom Background Images
          cat > "$RES/layout/streak_widget_layout.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_card_frame">

              <!-- Layer 1: Custom Background Wallpaper Image -->
              <ImageView
                  android:id="@+id/widget_bg_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop"
                  android:visibility="gone" />

              <!-- Layer 2: Translucent Overlay for High Contrast Text Reading -->
              <ImageView
                  android:id="@+id/widget_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@drawable/widget_photo_overlay"
                  android:visibility="gone" />

              <!-- Layer 3: Foreground Content -->
              <RelativeLayout
                  android:id="@+id/widget_content"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:padding="10dp">

                  <TextView
                      android:id="@+id/widget_xp_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentTop="true"
                      android:layout_alignParentLeft="true"
                      android:layout_alignParentStart="true"
                      android:background="@drawable/widget_xp_pill"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="2dp"
                      android:paddingBottom="2dp"
                      android:text="⚡ 0 XP"
                      android:textColor="#1E1E1E"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_app_title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentTop="true"
                      android:layout_alignParentRight="true"
                      android:layout_alignParentEnd="true"
                      android:text="CHEM EXPLORER"
                      android:textColor="#4D493C"
                      android:textSize="11sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:id="@+id/widget_center"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:gravity="center"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/widget_fire_icon"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🔥"
                          android:textSize="28sp" />

                      <TextView
                          android:id="@+id/widget_streak_num"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="0 Days Streak"
                          android:textColor="#1E1E1E"
                          android:textSize="18sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout
                      android:id="@+id/widget_bottom"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_alignParentBottom="true"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/widget_progress_text"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="📇 Daily Cards: 0 / 10"
                          android:textColor="#1E1E1E"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <ProgressBar
                          android:id="@+id/widget_progress_bar"
                          style="@android:style/Widget.ProgressBar.Horizontal"
                          android:layout_width="match_parent"
                          android:layout_height="6dp"
                          android:layout_marginTop="2dp"
                          android:max="10"
                          android:progress="0"
                          android:progressDrawable="@drawable/widget_progress_draw" />
                  </LinearLayout>
              </RelativeLayout>
          </RelativeLayout>
          XML

          # 5) Widget Info XML
          cat > "$RES/xml/streak_widget_info.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp"
              android:minHeight="80dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/streak_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          XML

          # 6) StreakWidgetProvider.java with Live Custom Background Sync
          cat > "$PKG_DIR/StreakWidgetProvider.java" <<'JAVA'
          package com.adityamaurya.chemexplorer;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONObject;

          public class StreakWidgetProvider extends AppWidgetProvider {

              public static void refreshAllWidgets(Context context) {
                  try {
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      int[] appWidgetIds = manager.getAppWidgetIds(new ComponentName(context, StreakWidgetProvider.class));
                      for (int appWidgetId : appWidgetIds) {
                          updateAppWidget(context, manager, appWidgetId);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      updateAppWidget(context, appWidgetManager, appWidgetId);
                  }
              }

              static void updateAppWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                  try {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.streak_widget_layout);

                      int xp = 0;
                      int streak = 0;
                      int dailyCount = 0;
                      int missedDays = 0;
                      String widgetBg = "default";

                      try {
                          SharedPreferences prefs = context.getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE);
                          String jsonStr = prefs.getString("CHEM_EXPLORER_V1_STATE", null);
                          if (jsonStr != null) {
                              JSONObject json = new JSONObject(jsonStr);
                              xp = json.optInt("xp", 0);
                              streak = json.optInt("streak", 0);
                              dailyCount = json.optInt("dailyCardsCount", 0);
                              missedDays = json.optInt("missedDays", 0);
                              JSONObject user = json.optJSONObject("user");
                              if (user != null) {
                                  widgetBg = user.optString("widgetBg", "default");
                              }
                          }
                      } catch (Exception ignored) {}

                      // Live sync custom photo background
                      boolean isCustom = false;
                      if (widgetBg != null && widgetBg.startsWith("widget")) {
                          String numStr = widgetBg.replace("widget", "");
                          int resId = context.getResources().getIdentifier("widget_bg_" + numStr, "drawable", context.getPackageName());
                          if (resId != 0) {
                              views.setImageViewResource(R.id.widget_bg_image, resId);
                              views.setViewVisibility(R.id.widget_bg_image, View.VISIBLE);
                              views.setViewVisibility(R.id.widget_overlay, View.VISIBLE);
                              isCustom = true;
                          }
                      }

                      if (!isCustom) {
                          views.setViewVisibility(R.id.widget_bg_image, View.GONE);
                          views.setViewVisibility(R.id.widget_overlay, View.GONE);
                          views.setTextColor(R.id.widget_streak_num, 0xFF1E1E1E);
                          views.setTextColor(R.id.widget_progress_text, 0xFF1E1E1E);
                          views.setTextColor(R.id.widget_app_title, 0xFF4D493C);
                      } else {
                          views.setTextColor(R.id.widget_streak_num, 0xFFFFFFFF);
                          views.setTextColor(R.id.widget_progress_text, 0xFFFFFFFF);
                          views.setTextColor(R.id.widget_app_title, 0xFFFFFFFF);
                      }

                      views.setTextViewText(R.id.widget_xp_text, "⚡ " + xp + " XP");

                      if (missedDays > 0 && dailyCount < 10) {
                          views.setTextViewText(R.id.widget_streak_num, streak + "d (⚠️ " + missedDays + " missed)");
                      } else {
                          views.setTextViewText(R.id.widget_streak_num, streak + " Days Streak");
                      }

                      views.setTextViewText(R.id.widget_progress_text, "📇 Daily Cards: " + Math.min(10, dailyCount) + " / 10");
                      views.setProgressBar(R.id.widget_progress_bar, 10, Math.min(10, dailyCount), false);

                      Intent intent = new Intent(context, MainActivity.class);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          flags |= PendingIntent.FLAG_IMMUTABLE;
                      }
                      PendingIntent pendingIntent = PendingIntent.getActivity(context, 0, intent, flags);
                      views.setOnClickPendingIntent(R.id.widget_root, pendingIntent);

                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  } catch (Exception ignored) {}
              }
          }
          JAVA

          # 7) Native Bridge in MainActivity.java
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package com.adityamaurya.chemexplorer;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void syncState(String json) {
                              SharedPreferences prefs = getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE);
                              prefs.edit().putString("CHEM_EXPLORER_V1_STATE", json).apply();
                              StreakWidgetProvider.refreshAllWidgets(MainActivity.this);
                          }
                      }, "NativeWidgetBridge");
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  StreakWidgetProvider.refreshAllWidgets(this);
              }
          }
          JAVA

          # 8) AndroidManifest.xml
          MANIFEST="$MAIN/AndroidManifest.xml"
          if ! grep -q "StreakWidgetProvider" "$MANIFEST"; then
            python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          receiver = (
              '    <receiver android:name="com.adityamaurya.chemexplorer.StreakWidgetProvider" android:exported="true">\n'
              '        <intent-filter>\n'
              '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              '        </intent-filter>\n'
              '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/streak_widget_info" />\n'
              '    </receiver>\n'
              '</application>'
          )
          if "</application>" in content:
              content = content.replace("</application>", receiver, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY
          fi

      - name: Setup Persistent Release Keystore & In-Place Update Signing
        run: |
          mkdir -p android/app

          cat <<'EOF' | base64 -d > android/app/release.keystore
          
          EOF

          python3 - <<'PY'
          import re
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()

          run_num = "${{ github.run_number }}"
          content = re.sub(r'versionCode\s+\d+', f'versionCode {run_num}', content)
          content = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', content)

          if "aaptOptions" in content:
              content = re.sub(r'(aaptOptions\s*\{)', r'\1\n        cruncherEnabled = false', content, count=1)
          else:
              content = re.sub(r'(android\s*\{)', r'\1\n    aaptOptions {\n        cruncherEnabled = false\n    }', content, count=1)

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'chemexplorer123'
                      keyAlias 'chemexplorer'
                      keyPassword 'chemexplorer123'
                  }
              }
          """
          if "signingConfigs" not in content:
              content = re.sub(r'(android\s*\{)', r'\1' + signing_block, content, count=1)
              content = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', content, count=1)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Chemistry-Explorer-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
