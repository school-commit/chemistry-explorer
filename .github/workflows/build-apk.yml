name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Auto-Link Flashcards & Vault Files into index.html
        run: |
          # 1. Copy any root-level fc-ch*.js or vault-part*.js into www/
          for f in fc-ch*.js vault-part*.js; do
            if [ -f "$f" ]; then
              cp "$f" "www/$f"
              echo "Moved $f to www/"
            fi
          done

          # 2. Inject all existing flashcard and vault scripts before games-engine.js
          python3 - <<'PY'
          import os
          path = "www/index.html"
          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          scripts = []

          # Flashcards fc-ch1.js to fc-ch9.js
          for i in range(1, 10):
              fname = f"fc-ch{i}.js"
              if os.path.exists(f"www/{fname}") and fname not in html:
                  scripts.append(f'<script src="{fname}"></script>')

          # Vault parts vault-part1.js to vault-part3.js
          for i in range(1, 4):
              fname = f"vault-part{i}.js"
              if os.path.exists(f"www/{fname}") and fname not in html:
                  scripts.append(f'<script src="{fname}"></script>')

          if scripts:
              inject = "\n  ".join(scripts) + '\n  <script src="games-engine.js"></script>'
              html = html.replace('<script src="games-engine.js"></script>', inject, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
              print("Successfully injected scripts into index.html:", scripts)
          else:
              print("No new scripts to inject.")
          PY

      - name: Save Native Widget Files (before android folder is recreated)
        run: |
          mkdir -p /tmp/native_widget
          SRC="android/app/src/main"
          [ -f "$SRC/java/com/adityamaurya/chemexplorer/StreakWidgetProvider.java" ] && cp "$SRC/java/com/adityamaurya/chemexplorer/StreakWidgetProvider.java" /tmp/native_widget/
          [ -f "$SRC/res/layout/streak_widget_layout.xml" ] && cp "$SRC/res/layout/streak_widget_layout.xml" /tmp/native_widget/
          [ -f "$SRC/res/xml/streak_widget_info.xml" ] && cp "$SRC/res/xml/streak_widget_info.xml" /tmp/native_widget/

      - name: Clean and Fresh Android Add & Sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Launcher Icon, Widget Bridge & All 6 Backgrounds
        run: |
          MAIN="android/app/src/main"
          RES="$MAIN/res"
          PKG_DIR="$MAIN/java/com/adityamaurya/chemexplorer"

          # Launcher icon
          if [ -f "www/assets/images/logo.png" ]; then
            rm -rf "$RES"/mipmap-anydpi-v26
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$RES/mipmap-$d"
              cp www/assets/images/logo.png "$RES/mipmap-$d/ic_launcher.png"
              cp www/assets/images/logo.png "$RES/mipmap-$d/ic_launcher_round.png"
              cp www/assets/images/logo.png "$RES/mipmap-$d/ic_launcher_foreground.png"
            done
          fi

          # Restore widget files
          mkdir -p "$PKG_DIR" "$RES/layout" "$RES/xml" "$RES/drawable" "$RES/drawable-nodpi"
          cp /tmp/native_widget/StreakWidgetProvider.java "$PKG_DIR/"
          cp /tmp/native_widget/streak_widget_layout.xml "$RES/layout/"
          cp /tmp/native_widget/streak_widget_info.xml "$RES/xml/"

          # Copy widget backgrounds
          for n in 1 2 3 4 5 6; do
            SRC="www/assets/images/widget$n.jpg"
            DST="$RES/drawable-nodpi/widget_bg_$n.jpg"
            if [ -f "$SRC" ]; then
              if command -v convert >/dev/null 2>&1; then
                convert "$SRC" -auto-orient -resize '1000x1000>' -strip -quality 90 "$DST" || cp "$SRC" "$DST"
              else
                cp "$SRC" "$DST"
              fi
              echo "Copied $DST"
            fi
          done

          # Create UI drawables
          cat > "$RES/drawable/widget_card_frame.xml" <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFF1A8" />
              <corners android:radius="18dp" />
              <stroke android:width="3dp" android:color="#FF1E1E1E" />
          </shape>
          XML

          cat > "$RES/drawable/widget_xp_pill.xml" <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFCDEBCB" />
              <corners android:radius="99dp" />
              <stroke android:width="2dp" android:color="#FF1E1E1E" />
          </shape>
          XML

          cat > "$RES/drawable/widget_yellow_pill.xml" <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFD95A" />
              <corners android:radius="10dp" />
              <stroke android:width="2dp" android:color="#FF1E1E1E" />
          </shape>
          XML

          cat > "$RES/drawable/widget_progress_draw.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape android:shape="rectangle">
                      <solid android:color="#FFFFFFFF" />
                      <corners android:radius="99dp" />
                      <stroke android:width="2dp" android:color="#FF1E1E1E" />
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape android:shape="rectangle">
                          <solid android:color="#FF8EE08A" />
                          <corners android:radius="99dp" />
                          <stroke android:width="2dp" android:color="#FF1E1E1E" />
                      </shape>
                  </clip>
              </item>
          </layer-list>
          XML

          # Inject NativeWidgetBridge
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package com.adityamaurya.chemexplorer;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void syncState(String json) {
                              SharedPreferences prefs = getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE);
                              prefs.edit().putString("CHEM_EXPLORER_V1_STATE", json).apply();
                              StreakWidgetProvider.refreshAllWidgets(MainActivity.this);
                          }
                      }, "NativeWidgetBridge");
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  StreakWidgetProvider.refreshAllWidgets(this);
              }
          }
          JAVA

          # Register receiver
          MANIFEST="$MAIN/AndroidManifest.xml"
          if ! grep -q "StreakWidgetProvider" "$MANIFEST"; then
            python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          receiver = (
              '    <receiver android:name="com.adityamaurya.chemexplorer.StreakWidgetProvider" android:exported="true">\n'
              '        <intent-filter>\n'
              '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              '        </intent-filter>\n'
              '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/streak_widget_info" />\n'
              '    </receiver>\n'
              '</application>'
          )
          if "</application>" in content:
              content = content.replace("</application>", receiver, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Chemistry-Explorer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
