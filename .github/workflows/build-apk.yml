name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Save Native Widget Files (before android folder is recreated)
        run: |
          mkdir -p /tmp/native_widget
          SRC="android/app/src/main"
          [ -f "$SRC/java/com/adityamaurya/chemexplorer/StreakWidgetProvider.java" ] && cp "$SRC/java/com/adityamaurya/chemexplorer/StreakWidgetProvider.java" /tmp/native_widget/ || echo "StreakWidgetProvider.java not found"
          [ -f "$SRC/res/layout/streak_widget_layout.xml" ] && cp "$SRC/res/layout/streak_widget_layout.xml" /tmp/native_widget/ || echo "streak_widget_layout.xml not found"
          [ -f "$SRC/res/xml/streak_widget_info.xml" ] && cp "$SRC/res/xml/streak_widget_info.xml" /tmp/native_widget/ || echo "streak_widget_info.xml not found"
          ls -la /tmp/native_widget

      - name: Clean and Fresh Android Add & Sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Launcher Icon and Native Widget Files Safely
        run: |
          MAIN="android/app/src/main"
          RES="$MAIN/res"

          # 1) Launcher icon (only real density folders; remove adaptive-icon xml so the png is used as-is)
          if [ -f "www/assets/images/logo.png" ]; then
            rm -rf "$RES"/mipmap-anydpi-v26
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$RES/mipmap-$d"
              cp www/assets/images/logo.png "$RES/mipmap-$d/ic_launcher.png"
              cp www/assets/images/logo.png "$RES/mipmap-$d/ic_launcher_round.png"
              cp www/assets/images/logo.png "$RES/mipmap-$d/ic_launcher_foreground.png"
            done
          fi

          # 2) Restore widget files
          if [ -f /tmp/native_widget/StreakWidgetProvider.java ]; then
            mkdir -p "$MAIN/java/com/adityamaurya/chemexplorer" "$RES/layout" "$RES/xml"
            cp /tmp/native_widget/StreakWidgetProvider.java "$MAIN/java/com/adityamaurya/chemexplorer/"
            cp /tmp/native_widget/streak_widget_layout.xml "$RES/layout/"
            cp /tmp/native_widget/streak_widget_info.xml "$RES/xml/"

            # 3) Register the receiver in AndroidManifest.xml (once)
            MANIFEST="$MAIN/AndroidManifest.xml"
            if ! grep -q "StreakWidgetProvider" "$MANIFEST"; then
              python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          receiver = (
              '    <receiver android:name="com.adityamaurya.chemexplorer.StreakWidgetProvider" android:exported="false">\n'
              '        <intent-filter>\n'
              '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              '        </intent-filter>\n'
              '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/streak_widget_info" />\n'
              '    </receiver>\n'
              '</application>'
          )
          if "</application>" in content:
              content = content.replace("</application>", receiver, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Widget receiver registered")
          PY
            fi
          fi

      - name: Prepare Widget Resources (background images + safety fixes)
        run: |
          MAIN="android/app/src/main"
          RES="$MAIN/res"
          LAYOUT="$RES/layout/streak_widget_layout.xml"

          if [ ! -f "$LAYOUT" ]; then
            echo "Widget layout nahi mila, is step ko skip kar raha hu"
            exit 0
          fi

          # A) Widget background photos: www/assets/images/widget1.jpg, widget2.jpg
          #    -> res/drawable-nodpi/widget_bg_1.jpg, widget_bg_2.jpg (max 900px, taaki widget heavy na ho)
          mkdir -p "$RES/drawable-nodpi"
          for n in 1 2; do
            SRC="www/assets/images/widget$n.jpg"
            DST="$RES/drawable-nodpi/widget_bg_$n.jpg"
            if [ -f "$SRC" ]; then
              if command -v convert >/dev/null 2>&1; then
                convert "$SRC" -auto-orient -resize '900x900>' -strip -quality 85 "$DST" || cp "$SRC" "$DST"
              else
                cp "$SRC" "$DST"
              fi
              echo "Created $DST"
            else
              echo "$SRC nahi mila -> widget default dark background use karega"
            fi
          done

          # B) Safety net: agar purani layout file repo me reh gayi ho to uski galtiyan yahi theek kar do
          #    "space_between" CSS ki value hai, Android gravity me valid nahi
          sed -i -E 's/"(space_between|space_around|space_evenly)"/"center_vertical"/g' "$LAYOUT"

          #    Jo @drawable / R.drawable use ho rahe hain par exist nahi karte unka placeholder bana do
          mkdir -p "$RES/drawable"
          cat > /tmp/placeholder_bg.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FF1A1A2E" android:endColor="#FF16213E" android:angle="135" />
              <corners android:radius="20dp" />
          </shape>
          XML

          NAMES=$( { grep -rhoE '@drawable/[A-Za-z0-9_]+' "$RES/layout" "$RES/xml" 2>/dev/null | sed 's#@drawable/##'; grep -rhoE 'R\.drawable\.[A-Za-z0-9_]+' "$MAIN/java" 2>/dev/null | sed 's#R\.drawable\.##'; } | sort -u || true )

          for n in $NAMES; do
            if ! ls "$RES"/drawable*/"$n".* >/dev/null 2>&1; then
              echo "Missing drawable '$n' -> placeholder bana raha hu"
              cp /tmp/placeholder_bg.xml "$RES/drawable/$n.xml"
            fi
          done

          echo "----- Drawables -----"
          ls -la "$RES"/drawable*/ 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Chemistry-Explorer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
